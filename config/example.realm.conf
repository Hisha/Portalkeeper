# Schema v1 public configuration generated by mod-realm-config.
# Obtain your realm's published file from its administrator.
[Config]
SchemaVersion=1

[Realm]
Name=Example Realm
Description=Private Wrath of the Lich King realm
WebsiteURL=https://example.com/

[Connection]
Address=realm.example.com
AuthPort=3724
WorldPort=8085

[Client]
Version=3.3.5a
Build=12340
Executable=Wow.exe
ExecutableSHA256=

[Portalkeeper]
MinimumVersion=0.2.0

[Services]
ManifestURL=
NewsURL=
StatusURL=
CalendarURL=
ArmoryURL=
ConfigURL=https://example.com/example.realm.conf

# Zero or more addons and patches are supported. Remove example components
# for a realm that does not use them. Optional components do not block launch.
[Addon.ExampleAddon]
Name=Example Addon
Requirement=Optional
SourceType=GitHub
SourceURL=https://github.com/Hisha/HuntsUI
Ref=main
InstallDirectory=HuntsUI

[Patch.ExamplePatch]
Name=Example Realm Patch
Requirement=Optional
SourceType=HTTP
SourceURL=https://example.com/patch-X.MPQ
FileName=patch-X.MPQ
InstallDirectory=Data
SHA256=
